<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tài liệu</title>
<meta name="theme-color" content="#2445C8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232445C8'/%3E%3Cpath d='M16 20h32a4 4 0 0 1 4 4v14a4 4 0 0 1-4 4H30l-9 7v-7h-5a4 4 0 0 1-4-4V24a4 4 0 0 1 4-4z' fill='%23FFE36E'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<style>
/* Layout: reader. Sticky bar (home / practice) -> one readable column rendered from the Markdown source */
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --sunk:#E8ECF3; --ink:#141B2D; --muted:#566178; --line:#D8DEE8;
  --accent:#2445C8; --on-accent:#FFFFFF; --bad:#C2312B; --hl:#FFE36E; --hl-ink:#141B2D;
  --font-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D121B; --surface:#151C29; --sunk:#1C2534; --ink:#E6EAF2; --muted:#9AA4B7; --line:#273145;
    --accent:#8AA4FF; --on-accent:#0D121B; --bad:#F87171; --hl:rgba(255,214,77,.22); --hl-ink:#FFE79A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D121B; --surface:#151C29; --sunk:#1C2534; --ink:#E6EAF2; --muted:#9AA4B7; --line:#273145;
  --accent:#8AA4FF; --on-accent:#0D121B; --bad:#F87171; --hl:rgba(255,214,77,.22); --hl-ink:#FFE79A;
  color-scheme:dark;
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.back{color:var(--muted);text-decoration:none;font-weight:600;font-size:15px}
.back:hover{color:var(--accent)}
.btn{display:inline-flex;align-items:center;font-weight:700;font-size:14px;border-radius:10px;padding:7px 14px;background:var(--accent);color:var(--on-accent);text-decoration:none;white-space:nowrap}

.doc{padding-block:24px 64px}
.doc h1{font-size:clamp(1.9rem,6vw,2.6rem);line-height:1.1;margin:0 0 .5em;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
.doc h2{font-size:1.45rem;line-height:1.25;margin:1.8em 0 .6em;font-weight:800;text-wrap:balance}
.doc h3{font-size:1.15rem;line-height:1.3;margin:1.6em 0 .5em;font-weight:800}
.doc h1,.doc h2,.doc h3{scroll-margin-top:72px}
.doc p,.doc li{max-width:68ch}
.doc a{color:var(--accent)}
.doc hr{border:0;border-top:1px solid var(--line);margin:2.4em 0}
.doc blockquote{margin:1em 0;padding:12px 16px;background:var(--sunk);border-radius:12px}
.doc blockquote p{margin:.3em 0}
.doc code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.9em;background:var(--sunk);border-radius:5px;padding:.1em .35em}
.doc del{color:var(--muted);text-decoration-color:var(--bad);text-decoration-thickness:2px}
.doc em{color:var(--muted)}
.table-wrap{overflow-x:auto;margin:1em 0 1.2em;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.doc table{border-collapse:collapse;width:100%;font-size:15px;line-height:1.5}
.doc th,.doc td{padding:9px 12px;text-align:left;vertical-align:top;border-top:1px solid var(--line);min-width:6.5em}
.doc thead th{background:var(--sunk);font-size:13px;font-weight:700;border-top:0}
.doc td strong{background:var(--hl);color:var(--hl-ink);padding:0 .15em;border-radius:3px;font-weight:700}
.doc details{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:.4em 0 1.4em}
.doc summary{cursor:pointer;font-weight:700;color:var(--accent)}
.doc details[open] summary{margin-bottom:6px}
.doc ol,.doc ul{padding-left:1.4em}
.msg{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.msg h1{font-size:1.4rem}
.list{display:grid;gap:10px;padding:0;list-style:none}
.list a{display:block;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-weight:700;text-decoration:none}
</style>
</head>
<body>
<header class="bar">
  <div class="wrap">
    <a class="back" href="index.html">← Trang chủ</a>
    <a class="btn" id="practice" href="index.html" hidden>Luyện tập</a>
  </div>
</header>
<main class="wrap">
  <article class="doc" id="doc"><p>Đang tải tài liệu…</p></article>
</main>
<script>
const DOCS = {
  'khung-cau-phan-xa.md': { title: 'Khung Câu Phản Xạ', practice: 'khung-cau-phan-xa.html', label: 'Luyện tập' },
  'bay-dich-viet-anh.md': { title: 'Bẫy Dịch Việt → Anh', practice: 'bay-dich-viet-anh.html', label: 'Luyện thẻ' }
};
const docEl = document.getElementById('doc');
const slug = s => s.trim().toLowerCase().replace(/[^\p{L}\p{N}\s-]/gu, '').replace(/ /g, '-');
const f = new URLSearchParams(location.search).get('f');
const meta = DOCS[f];

function showList(heading, text) {
  docEl.innerHTML = `<div class="msg"><h1>${heading}</h1><p>${text}</p><ul class="list">` +
    Object.entries(DOCS).map(([file, d]) => `<li><a href="doc.html?f=${file}">${d.title}</a></li>`).join('') +
    `</ul></div>`;
}

function enhance() {
  docEl.querySelectorAll('h1, h2, h3, h4').forEach(h => { if (!h.id) h.id = slug(h.textContent); });
  docEl.querySelectorAll('table').forEach(t => {
    const w = document.createElement('div');
    w.className = 'table-wrap';
    t.parentNode.insertBefore(w, t);
    w.appendChild(t);
  });
  docEl.querySelectorAll('a[href]').forEach(a => {
    const href = a.getAttribute('href');
    const m = href.match(/^([\w-]+\.md)(#.*)?$/);
    if (m && DOCS[m[1]]) a.setAttribute('href', `doc.html?f=${m[1]}${m[2] || ''}`);
    else if (/^https?:/i.test(href)) { a.target = '_blank'; a.rel = 'noopener'; }
  });
  if (location.hash) {
    const el = document.getElementById(decodeURIComponent(location.hash.slice(1)));
    if (el) el.scrollIntoView();
  }
}

if (!meta) {
  showList('Chọn tài liệu', 'Bạn muốn đọc tài liệu nào?');
} else {
  document.title = meta.title;
  const p = document.getElementById('practice');
  p.href = meta.practice; p.textContent = meta.label; p.hidden = false;
  fetch(f, { cache: 'no-cache' })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(md => {
      if (!window.marked) throw new Error('marked');
      docEl.innerHTML = marked.parse(md, { gfm: true, headerIds: false, mangle: false });
      enhance();
    })
    .catch(() => {
      docEl.innerHTML = `<div class="msg"><h1>Không tải được tài liệu</h1><p>Hãy kiểm tra kết nối mạng rồi tải lại trang. Nếu bạn đang mở file trực tiếp trên máy tính, hãy đọc file <code>${f}</code> bằng VS Code.</p></div>`;
    });
}
</script>
</body>
</html>
