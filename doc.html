<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tài liệu</title>
<meta name="theme-color" content="#2445C8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232445C8'/%3E%3Cpath d='M16 20h32a4 4 0 0 1 4 4v14a4 4 0 0 1-4 4H30l-9 7v-7h-5a4 4 0 0 1-4-4V24a4 4 0 0 1 4-4z' fill='%23FFE36E'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<style>
/* Layout: reader. Sticky top bar (home / practice) -> one readable column rendered from Markdown -> fixed bottom nav (prev / current section + TOC sheet / next) */
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --sunk:#E8ECF3; --ink:#141B2D; --muted:#566178; --line:#D8DEE8;
  --accent:#2445C8; --accent-soft:#E2E8FF; --on-accent:#FFFFFF; --bad:#C2312B; --hl:#FFE36E; --hl-ink:#141B2D;
  --scrim:rgba(13,18,27,.45);
  --font-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D121B; --surface:#151C29; --sunk:#1C2534; --ink:#E6EAF2; --muted:#9AA4B7; --line:#273145;
    --accent:#8AA4FF; --accent-soft:#1E2A4A; --on-accent:#0D121B; --bad:#F87171; --hl:rgba(255,214,77,.22); --hl-ink:#FFE79A;
    --scrim:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D121B; --surface:#151C29; --sunk:#1C2534; --ink:#E6EAF2; --muted:#9AA4B7; --line:#273145;
  --accent:#8AA4FF; --accent-soft:#1E2A4A; --on-accent:#0D121B; --bad:#F87171; --hl:rgba(255,214,77,.22); --hl-ink:#FFE79A;
  --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
body.locked{overflow:hidden}
[hidden]{display:none!important}
.wrap{max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.back{color:var(--muted);text-decoration:none;font-weight:600;font-size:15px}
.back:hover{color:var(--accent)}
.btn{display:inline-flex;align-items:center;font-weight:700;font-size:14px;border-radius:10px;padding:7px 14px;background:var(--accent);color:var(--on-accent);text-decoration:none;white-space:nowrap}

/* Document */
.doc{padding-block:24px 64px}
.has-nav .doc{padding-bottom:120px}
.doc h1{font-size:clamp(1.9rem,6vw,2.6rem);line-height:1.1;margin:0 0 .5em;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
.doc h2{font-size:1.45rem;line-height:1.25;margin:1.8em 0 .6em;font-weight:800;text-wrap:balance}
.doc h3{font-size:1.15rem;line-height:1.3;margin:1.6em 0 .5em;font-weight:800}
.doc h1,.doc h2,.doc h3{scroll-margin-top:72px}
.doc p,.doc li{max-width:68ch}
.doc a{color:var(--accent)}
.doc hr{border:0;border-top:1px solid var(--line);margin:2.4em 0}
.doc blockquote{margin:1em 0;padding:12px 16px;background:var(--sunk);border-radius:12px}
.doc blockquote p{margin:.3em 0}
.doc code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.9em;background:var(--sunk);border-radius:5px;padding:.1em .35em}
.doc del{color:var(--muted);text-decoration-color:var(--bad);text-decoration-thickness:2px}
.doc em{color:var(--muted)}
.table-wrap{overflow-x:auto;margin:1em 0 1.2em;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.doc table{border-collapse:collapse;width:100%;font-size:15px;line-height:1.5}
.doc th,.doc td{padding:9px 12px;text-align:left;vertical-align:top;border-top:1px solid var(--line);min-width:6.5em}
.doc thead th{background:var(--sunk);font-size:13px;font-weight:700;border-top:0}
.doc td strong{background:var(--hl);color:var(--hl-ink);padding:0 .15em;border-radius:3px;font-weight:700}
.doc .c-num{min-width:0;width:1%;white-space:nowrap}

/* Tables as stacked cards on narrow screens (class added by script when a table would overflow) */
.table-wrap.stack{overflow:visible;background:transparent;border:0;border-radius:0}
.stack table,.stack tbody{display:block;width:100%}
.stack thead{display:none}
.stack tr{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.stack tr.empty-row{display:none}
.stack td{display:block;flex:1 1 100%;min-width:0;border:0;padding:0}
.stack td.empty{display:none}
.stack td.c-num{flex:0 0 auto;width:auto;font-weight:800;color:var(--accent)}
.stack td.c-title{flex:1 1 0;font-weight:700;font-size:16px}
.stack td.c-bad{font-size:14px}
.stack td.c-bad::before{content:"❌ "}
.stack td.c-good{font-size:17px;font-weight:600;line-height:1.45}
.stack td.c-good::before{content:"✅ "}
.stack td.c-good em{display:block;font-size:14px;font-weight:400;margin-top:2px}
.stack td.c-other{font-size:15px}
.stack td.c-other[data-label]:not([data-label=""])::before{content:attr(data-label) ": ";color:var(--muted);font-size:13px;font-weight:600}
.doc details{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:.4em 0 1.4em}
.doc summary{cursor:pointer;font-weight:700;color:var(--accent)}
.doc details[open] summary{margin-bottom:6px}
.doc ol,.doc ul{padding-left:1.4em}
.msg{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.msg h1{font-size:1.4rem}
.list{display:grid;gap:10px;padding:0;list-style:none}
.list a{display:block;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-weight:700;text-decoration:none}

/* Bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .wrap{display:grid;grid-template-columns:52px minmax(0,1fr) 52px;gap:8px;padding-block:8px}
.nav-btn{height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.nav-btn:hover:not(:disabled){border-color:var(--accent)}
.nav-btn:disabled{opacity:.35;cursor:default}
.nav-cur{display:flex;align-items:center;gap:10px;min-width:0;height:48px;padding:0 16px;border-radius:12px;border:0;background:var(--accent);color:var(--on-accent);font:inherit;font-weight:700;font-size:15px;cursor:pointer;text-align:left}
.nav-cur span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.nav-cur svg{flex:none}

/* TOC sheet */
.scrim{position:fixed;inset:0;z-index:20;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:820px;max-height:80vh;max-height:80dvh;border-radius:18px 18px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -8px 30px rgba(0,0,0,.25);animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.sheet-head h2{margin:0;font-size:1.1rem;font-weight:800}
.close{width:40px;height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.toc{list-style:none;margin:0;padding:8px max(8px,env(safe-area-inset-right,0px)) 16px max(8px,env(safe-area-inset-left,0px));overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.toc a{display:block;padding:10px 12px;border-radius:10px;color:var(--ink);text-decoration:none;line-height:1.35}
.toc a:hover{background:var(--sunk)}
.toc .lv2 a{font-weight:800;margin-top:4px}
.toc .lv3 a{padding-left:28px;font-size:15px;color:var(--muted)}
.toc a[aria-current="true"]{background:var(--accent-soft);color:var(--ink);font-weight:800}
.toc .top a{color:var(--accent);font-weight:700}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}}
</style>
</head>
<body>
<header class="bar">
  <div class="wrap">
    <a class="back" href="index.html">← Trang chủ</a>
    <a class="btn" id="practice" href="index.html" hidden>Luyện tập</a>
  </div>
</header>
<main class="wrap">
  <article class="doc" id="doc"><p>Đang tải tài liệu…</p></article>
</main>

<nav class="nav" id="nav" aria-label="Điều hướng tài liệu" hidden>
  <div class="wrap">
    <button class="nav-btn" type="button" id="prev" aria-label="Mục trước">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <button class="nav-cur" type="button" id="navCur" aria-haspopup="dialog" aria-controls="sheet">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      <span id="navLabel">Mục lục</span>
    </button>
    <button class="nav-btn" type="button" id="next" aria-label="Mục sau">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
    </button>
  </div>
</nav>

<div class="scrim" id="scrim" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head">
      <h2 id="sheetTitle">Mục lục</h2>
      <button class="close" type="button" id="closeSheet" aria-label="Đóng mục lục">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <ul class="toc" id="toc"></ul>
  </div>
</div>

<script>
const DOCS = {
  'khung-cau-phan-xa.md': { title: 'Khung Câu Phản Xạ', practice: 'khung-cau-phan-xa.html', label: 'Luyện tập' },
  'bay-dich-viet-anh.md': { title: 'Bẫy Dịch Việt → Anh', practice: 'bay-dich-viet-anh.html', label: 'Luyện thẻ' }
};
const $ = id => document.getElementById(id);
const docEl = $('doc');
const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const slug = s => s.trim().toLowerCase().replace(/[^\p{L}\p{N}\s-]/gu, '').replace(/ /g, '-');
const f = new URLSearchParams(location.search).get('f');
const meta = DOCS[f];

function showList(heading, text) {
  docEl.innerHTML = `<div class="msg"><h1>${heading}</h1><p>${text}</p><ul class="list">` +
    Object.entries(DOCS).map(([file, d]) => `<li><a href="doc.html?f=${file}">${d.title}</a></li>`).join('') +
    `</ul></div>`;
}

/* Section navigation */
let heads = [], cur = -1, lastFocus = null;
const shortTitle = h => h.textContent.trim().replace(/^Phần /, '');

function buildNav() {
  heads = Array.from(docEl.querySelectorAll('h2, h3')).filter(h => !/^mục lục$/i.test(h.textContent.trim()));
  if (!heads.length) return;
  $('toc').innerHTML = `<li class="top"><a href="#" data-i="-1">↑ Đầu trang</a></li>` +
    heads.map((h, i) => `<li class="lv${h.tagName[1]}"><a href="#${esc(h.id)}" data-i="${i}">${esc(h.textContent.trim())}</a></li>`).join('');
  $('nav').hidden = false;
  document.body.classList.add('has-nav');
  update();
}

function currentIndex() {
  const offset = document.querySelector('.bar').getBoundingClientRect().bottom + window.innerHeight * 0.3;
  let c = -1;
  for (let i = 0; i < heads.length; i++) {
    if (heads[i].getBoundingClientRect().top <= offset) c = i; else break;
  }
  return c;
}

function update() {
  cur = currentIndex();
  $('navLabel').textContent = cur >= 0 ? shortTitle(heads[cur]) : 'Mục lục';
  $('prev').disabled = cur < 0;
  $('next').disabled = cur >= heads.length - 1;
}

function jump(i) {
  const behavior = reduceMotion ? 'auto' : 'smooth';
  if (i < 0) {
    window.scrollTo({ top: 0, behavior });
    history.replaceState(null, '', location.pathname + location.search);
  } else {
    heads[i].scrollIntoView({ block: 'start', behavior });
    history.replaceState(null, '', '#' + heads[i].id);
  }
}

let ticking = false;
window.addEventListener('scroll', () => {
  if (ticking) return;
  ticking = true;
  requestAnimationFrame(() => { ticking = false; if (heads.length) update(); });
}, { passive: true });

$('prev').addEventListener('click', () => jump(cur - 1));
$('next').addEventListener('click', () => jump(cur + 1));

function openSheet() {
  lastFocus = document.activeElement;
  update();
  $('toc').querySelectorAll('a').forEach(a => a.removeAttribute('aria-current'));
  const active = $('toc').querySelector(`a[data-i="${cur}"]`);
  if (active && cur >= 0) active.setAttribute('aria-current', 'true');
  $('scrim').hidden = false;
  document.body.classList.add('locked');
  const list = $('toc');
  if (active) list.scrollTop = Math.max(0, active.offsetTop - list.clientHeight / 2 + active.offsetHeight / 2);
  (active || $('closeSheet')).focus({ preventScroll: true });
}
function closeSheet() {
  $('scrim').hidden = true;
  document.body.classList.remove('locked');
  if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true });
}
$('navCur').addEventListener('click', openSheet);
$('closeSheet').addEventListener('click', closeSheet);
$('scrim').addEventListener('click', e => { if (e.target === $('scrim')) closeSheet(); });
$('toc').addEventListener('click', e => {
  const a = e.target.closest('a[data-i]');
  if (!a) return;
  e.preventDefault();
  closeSheet();
  jump(+a.dataset.i);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('scrim').hidden) closeSheet();
});

/* Tables: tag each column with a role so a row can be shown as a card on narrow screens */
function prepTable(t, w) {
  const ths = Array.from(t.querySelectorAll('thead th'));
  const heads = ths.map(th => th.textContent.trim());
  let titled = false;
  const roles = heads.map(h => {
    if (h === '#') return 'c-num';
    if (/^❌/.test(h)) return 'c-bad';
    if (/^✅/.test(h)) return 'c-good';
    if (!titled) { titled = true; return 'c-title'; }
    return 'c-other';
  });
  ths.forEach((th, i) => th.classList.add(roles[i]));
  t.querySelectorAll('tbody tr').forEach(tr => {
    let allEmpty = true;
    Array.from(tr.children).forEach((td, i) => {
      const role = roles[i] || 'c-other';
      td.classList.add(role);
      if (role === 'c-other') td.dataset.label = heads[i] || '';
      if (td.textContent.trim()) allEmpty = false; else td.classList.add('empty');
    });
    if (allEmpty) tr.classList.add('empty-row');
  });
  if (roles.includes('c-good')) w.classList.add('trap');
}
function fitTables() {
  const narrow = window.innerWidth < 600;
  document.querySelectorAll('.table-wrap').forEach(w => {
    w.classList.remove('stack');
    const overflow = w.querySelector('table').scrollWidth > w.clientWidth + 4;
    if (overflow || (narrow && w.classList.contains('trap'))) w.classList.add('stack');
  });
}
let resizeTick = false;
window.addEventListener('resize', () => {
  if (resizeTick) return;
  resizeTick = true;
  requestAnimationFrame(() => { resizeTick = false; fitTables(); if (heads.length) update(); });
});
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (document.querySelector('.table-wrap')) fitTables(); });

/* Render */
function enhance() {
  docEl.querySelectorAll('h1, h2, h3, h4').forEach(h => { if (!h.id) h.id = slug(h.textContent); });
  docEl.querySelectorAll('table').forEach(t => {
    const w = document.createElement('div');
    w.className = 'table-wrap';
    t.parentNode.insertBefore(w, t);
    w.appendChild(t);
    prepTable(t, w);
  });
  fitTables();
  docEl.querySelectorAll('a[href]').forEach(a => {
    const href = a.getAttribute('href');
    const m = href.match(/^([\w-]+\.md)(#.*)?$/);
    if (m && DOCS[m[1]]) a.setAttribute('href', `doc.html?f=${m[1]}${m[2] || ''}`);
    else if (/^https?:/i.test(href)) { a.target = '_blank'; a.rel = 'noopener'; }
  });
  buildNav();
  if (location.hash) {
    const el = document.getElementById(decodeURIComponent(location.hash.slice(1)));
    if (el) el.scrollIntoView();
  }
}

if (!meta) {
  showList('Chọn tài liệu', 'Bạn muốn đọc tài liệu nào?');
} else {
  document.title = meta.title;
  const p = $('practice');
  p.href = meta.practice; p.textContent = meta.label; p.hidden = false;
  fetch(f, { cache: 'no-cache' })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(md => {
      if (!window.marked) throw new Error('marked');
      docEl.innerHTML = marked.parse(md, { gfm: true, headerIds: false, mangle: false });
      enhance();
    })
    .catch(() => {
      docEl.innerHTML = `<div class="msg"><h1>Không tải được tài liệu</h1><p>Hãy kiểm tra kết nối mạng rồi tải lại trang. Nếu bạn đang mở file trực tiếp trên máy tính, hãy đọc file <code>${esc(f)}</code> bằng VS Code.</p></div>`;
    });
}
</script>
</body>
</html>
